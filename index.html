<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vaugn Studio — Dashboard</title>
  <meta name="description" content="Personal metrics dashboard — finance, business, content & health, tracked in one place." />
  <meta name="color-scheme" content="dark" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; object-src 'none'; base-uri 'self'" />
  <meta name="theme-color" content="#0a0c10" />
  <script>try { var _t = JSON.parse(localStorage.getItem("vaugn.dashboard.v1")).settings.theme; if (_t && _t !== "midnight") document.documentElement.dataset.theme = _t; } catch (e) {}</script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%237c5cff'/><text x='50' y='68' font-size='52' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%230a0c10'>V</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="dashboard">
  <div class="shell">

    <!-- Top bar -->
    <header class="topbar">
      <div class="brand">
        <span class="brand__mark">V</span>
        <span>
          Vaugn Studio
          <span class="brand__sub">Personal Dashboard</span>
        </span>
      </div>
      <nav class="nav" aria-label="Main">
        <a class="nav__link is-active" href="index.html" aria-current="page">Dashboard</a>
        <a class="nav__link" href="crm.html">Sales Pipeline</a>
        <a class="nav__link" href="reports.html">Reports</a>
      </nav>
      <div class="topbar__actions">
      <button class="icon-btn" id="helpBtn" aria-label="How to use this dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <path d="M12 17h.01"/>
        </svg>
        Help
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Open settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Settings
      </button>
      </div>
    </header>

    <!-- Hero -->
    <section class="hero" aria-label="Overview">
      <div>
        <p class="hero__date" id="todayLine"></p>
        <h1 class="hero__title"><span id="greeting"></span><br />Here's where <em>everything</em> stands.</h1>
        <p class="hero__meta" id="lastUpdated"></p>
      </div>
      <div class="ring" id="overallRing" role="img" aria-label="Overall progress toward all goals">
        <div class="ring__inner">
          <span class="ring__pct" id="overallPct">0%</span>
          <span class="ring__label">All goals</span>
        </div>
      </div>
    </section>

    <div class="hero-stats" id="heroStats" aria-label="Headline stats"></div>

    <div id="checklist"></div>

    <!-- Pipeline summary strip (renders only when the CRM has data) -->
    <div id="pipeStrip"></div>

    <!-- Metric sections (rendered by app.js) -->
    <main id="sections"></main>

    <footer class="footer">
      <span>Data lives in your browser · optional Google Sheets sync in Settings</span>
      <span>Vaugn Studio — your business, one page</span>
    </footer>
  </div>

  <!-- Settings drawer is injected by assets/js/settings.js -->

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Help Center, help modal, welcome card & tour overlay are injected by help.js / tour.js -->

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/sheets-sync.js"></script>
  <script src="assets/js/crm/crm-data.js"></script>
  <script src="assets/js/crm/crm-store.js"></script>
  <script src="assets/js/history.js"></script>
  <script src="assets/js/settings.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/tour.js"></script>
  <script src="assets/js/help.js"></script>
  <script src="assets/js/sample-data.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
